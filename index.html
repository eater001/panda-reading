<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三字经 · 艾宾浩斯记忆闯关</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
    background:linear-gradient(145deg,#fef9e7 0%,#fdebd0 100%);
    min-height:100vh;display:flex;justify-content:center;align-items:flex-start;
    font-family:'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;
    padding:16px;margin:0;overflow-x:hidden;
}
.game-wrapper{
    max-width:760px;width:100%;background:#fff9ef;
    border-radius:48px 48px 32px 32px;
    box-shadow:0 20px 40px rgba(180,120,70,.2),0 8px 16px rgba(0,0,0,.08);
    padding:22px 22px 30px;border:4px solid #f7d9aa;position:relative;
}
.header{
    display:flex;justify-content:space-between;align-items:center;
    padding:0 6px 14px;border-bottom:3px dashed #e6c9a8;margin-bottom:16px;gap:8px;
    position:relative;z-index:10;
}
.header h1{
    font-size:1.4rem;color:#a1582e;letter-spacing:2px;
    text-shadow:2px 2px 0 #f0d5b0;font-weight:700;display:flex;align-items:center;gap:6px;
    flex:1;
}
.header-right{display:flex;align-items:center;gap:8px}
.score-board{
    background:#d9b382;padding:6px 14px;border-radius:60px;color:#2e1b0e;
    font-weight:700;font-size:.95rem;
    box-shadow:inset 0 -3px 0 #b28b5c,0 6px 12px rgba(150,100,50,.25);
    display:flex;align-items:center;gap:5px;position:relative;
}
.score-board.bump{animation:bump .35s ease}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.2)}100%{transform:scale(1)}}
.score-board .star{font-size:1.2rem;line-height:1;color:#ffc107;text-shadow:0 2px 0 #b87c1b}

/* 返回按钮（只在关卡内显示） */
.back-btn{
    background:#90caf9;border:none;color:#0d47a1;font-weight:800;font-size:.9rem;
    padding:8px 16px;border-radius:40px;cursor:pointer;letter-spacing:1px;
    box-shadow:0 4px 0 #1565c0;transition:all .1s;
    font-family:inherit;display:flex;align-items:center;gap:4px;
}
.back-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1565c0}
.back-btn[hidden]{display:none}

.level-bar{
    display:flex;align-items:center;justify-content:space-between;
    background:#f7e9d5;border-radius:40px;padding:10px 18px;margin-bottom:16px;
    box-shadow:inset 0 2px 6px rgba(150,100,50,.15);flex-wrap:wrap;gap:8px;
}
.level-info{display:flex;align-items:center;gap:10px}
.level-badge{
    background:#ffb74d;color:#4a2e18;font-weight:800;font-size:.9rem;
    padding:5px 14px;border-radius:40px;box-shadow:0 3px 0 #b46f1e;letter-spacing:1px;
}
.level-title{font-size:.85rem;color:#8a6a4a;font-weight:600;letter-spacing:1px}
.level-dots{display:flex;gap:5px;flex-wrap:wrap}
.level-dot{
    width:22px;height:22px;border-radius:50%;
    background:#e0c9a8;box-shadow:inset 0 2px 3px rgba(150,100,50,.3);
    display:flex;align-items:center;justify-content:center;
    font-size:.7rem;font-weight:800;color:#8a6a4a;transition:all .3s;
}
.level-dot.done{background:#ffb74d;color:#4a2e18;box-shadow:0 2px 0 #b46f1e}
.level-dot.current{
    background:#fff;border:3px solid #ff9800;
    box-shadow:0 0 0 4px rgba(255,152,0,.25);animation:pulseDot 1.5s infinite;
}
@keyframes pulseDot{
    0%,100%{box-shadow:0 0 0 4px rgba(255,152,0,.25)}
    50%{box-shadow:0 0 0 8px rgba(255,152,0,.12)}
}

.fade-in{animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.map-title{
    text-align:center;font-size:1.25rem;color:#a1582e;font-weight:800;
    letter-spacing:3px;margin-bottom:4px;
}
.map-sub{
    text-align:center;font-size:.8rem;color:#b98a63;margin-bottom:6px;letter-spacing:1px;
}
.progress-outer{
    background:#f0dbb8;border-radius:20px;height:12px;margin:8px 20px 16px;
    overflow:hidden;box-shadow:inset 0 2px 4px rgba(150,100,50,.2);
}
.progress-inner{
    height:100%;background:linear-gradient(90deg,#ffb74d,#ff9800);
    border-radius:20px;width:0%;transition:width .5s ease;
}
.review-banner{
    background:linear-gradient(135deg,#b3e5fc,#81d4fa);
    border-radius:22px;padding:14px 18px;margin-bottom:14px;
    box-shadow:0 6px 0 #4fc3f7,0 8px 16px rgba(30,100,180,.2);
    display:flex;align-items:center;justify-content:space-between;
    cursor:pointer;transition:all .15s;gap:10px;
}
.review-banner:active{transform:translateY(4px);box-shadow:0 2px 0 #4fc3f7}
.review-banner .rb-left{display:flex;align-items:center;gap:12px}
.review-banner .rb-icon{font-size:2rem;line-height:1}
.review-banner .rb-text{display:flex;flex-direction:column;gap:2px}
.review-banner .rb-title{font-size:1rem;font-weight:800;color:#0d47a1;letter-spacing:1px}
.review-banner .rb-sub{font-size:.75rem;color:#1565c0;font-weight:600;letter-spacing:1px}
.review-banner .rb-count{
    background:#fff;color:#0d47a1;font-weight:800;font-size:1.1rem;
    padding:6px 16px;border-radius:40px;box-shadow:inset 0 2px 4px rgba(30,100,180,.2);
}

.level-group{margin-bottom:14px}
.level-group-title{
    font-size:.78rem;color:#b98a63;font-weight:700;letter-spacing:1px;
    margin-bottom:8px;padding-left:6px;
}
.level-grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
}
.level-card{
    background:#fef3e2;border-radius:20px;padding:12px 4px 8px;
    text-align:center;cursor:pointer;transition:all .2s;
    box-shadow:inset 0 0 0 2px #f7e2c0,0 5px 0 #d9b382;position:relative;
}
.level-card:active{transform:translateY(4px);box-shadow:inset 0 0 0 2px #f7e2c0,0 1px 0 #d9b382}
.level-card.locked{opacity:.45;cursor:not-allowed;box-shadow:inset 0 0 0 2px #f7e2c0,0 5px 0 #c9b088}
.level-card.locked:active{transform:none}
.level-card .lv-num{font-size:1.25rem;font-weight:800;color:#6b3f1c}
.level-card .lv-stars{font-size:.8rem;margin-top:3px;letter-spacing:1px;min-height:1rem}
.level-card .lv-label{font-size:.65rem;color:#a5835a;font-weight:600;margin-top:2px;line-height:1.2}
.level-card .lock-icon{position:absolute;top:5px;right:7px;font-size:.85rem;opacity:.7}
.level-card.unlocked .lock-icon{display:none}

.card-scene{perspective:1000px;margin-bottom:16px}
.learn-card{
    background:transparent;border-radius:36px;position:relative;width:100%;height:250px;
    cursor:pointer;user-select:none;transform-style:preserve-3d;
    transition:transform .6s cubic-bezier(.4,0,.2,1);
}
.learn-card.flipped{transform:rotateY(180deg)}
.card-face{
    position:absolute;width:100%;height:100%;backface-visibility:hidden;
    border-radius:36px;display:flex;flex-direction:column;justify-content:center;align-items:center;
    padding:14px 16px;box-shadow:inset 0 0 0 2px #f7e2c0,inset 0 0 20px #f0dbb8;
}
.card-front{background:#fef3e2}
.card-back{
    background:#f0e2cf;transform:rotateY(180deg);
    box-shadow:inset 0 0 0 2px #e0c9a8,inset 0 0 20px #d9c4a4;
}
.card-back .question-mark{
    font-size:5.5rem;font-weight:800;color:#c9a87c;line-height:1;
    text-shadow:4px 4px 0 #b89468;animation:breathe 2s ease-in-out infinite;
}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.08);opacity:1}}
.learn-label{
    display:inline-block;background:#ffb74d;color:#4a2e18;font-size:.8rem;
    font-weight:700;padding:3px 14px;border-radius:40px;letter-spacing:1px;
    margin-bottom:8px;box-shadow:0 3px 0 #b46f1e;
}
.learn-label.review{background:#81d4fa;box-shadow:0 3px 0 #0288d1;color:#0d47a1}
.learn-label.new{background:#ffb74d;box-shadow:0 3px 0 #b46f1e}
.speaker-icon{position:absolute;top:12px;right:16px;font-size:1.4rem;opacity:.7}
.big-line{
    font-size:3.8rem;font-weight:800;color:#6b3f1c;line-height:1.3;
    text-shadow:5px 5px 0 #edd6b6;letter-spacing:12px;padding:4px 0;
    text-align:center;word-break:break-all;
}
.big-line.pop{animation:pop .5s ease}
@keyframes pop{
    0%{transform:scale(1) rotate(0)}30%{transform:scale(1.12) rotate(-2deg)}
    60%{transform:scale(1.05) rotate(1deg)}100%{transform:scale(1) rotate(0)}
}
.big-pinyin{
    font-size:1.2rem;font-weight:600;color:#b98a63;letter-spacing:2px;
    margin-top:8px;line-height:1.5;text-align:center;
}
.back-hint{
    font-size:.95rem;color:#a5835a;font-weight:600;letter-spacing:2px;
    margin-top:10px;background:rgba(255,242,226,.7);padding:5px 18px;border-radius:30px;
}
.countdown-hint{
    position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
    font-size:.75rem;color:#b98a63;font-weight:600;letter-spacing:1px;
    opacity:0;transition:opacity .3s;
}
.countdown-hint.show{opacity:1}

.practice-area{
    opacity:0;visibility:hidden;transform:translateY(12px);
    transition:opacity .4s ease,transform .4s ease,visibility .4s;pointer-events:none;
}
.practice-area.visible{opacity:1;visibility:visible;transform:translateY(0);pointer-events:auto}
.practice-title{
    text-align:center;font-size:1.05rem;color:#a1582e;font-weight:700;
    letter-spacing:1px;margin-bottom:10px;min-height:1.5rem;
}
.options-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 2px 10px}
.option-btn{
    background:#fffcf6;border:4px solid #e2c6a2;border-radius:22px;
    padding:18px 8px;font-size:1.8rem;font-weight:700;color:#3d2b1a;
    display:flex;justify-content:center;align-items:center;cursor:pointer;
    transition:all .1s ease;box-shadow:0 6px 0 #b28b5c,0 8px 14px rgba(130,80,40,.18);
    user-select:none;font-family:inherit;line-height:1.4;letter-spacing:6px;
    text-align:center;word-break:break-all;
}
.option-btn:hover:not(:disabled){background:#fff6e6;transform:translateY(-2px);
    box-shadow:0 8px 0 #b28b5c,0 12px 18px rgba(130,80,40,.22)}
.option-btn:active:not(:disabled){transform:translateY(4px);
    box-shadow:0 2px 0 #b28b5c,0 6px 10px rgba(130,80,40,.18)}
.option-btn.correct{
    background:#c8e6c9;border-color:#6b9e6b;color:#1e4a1e;
    box-shadow:0 6px 0 #4a754a,0 8px 14px rgba(70,120,70,.3);
    animation:correctPop .4s ease;
}
@keyframes correctPop{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
.option-btn.wrong{
    background:#ffcdd2;border-color:#c97b7b;color:#6b2a2a;
    box-shadow:0 6px 0 #a15c5c,0 8px 14px rgba(160,80,80,.25);
    animation:shake .4s ease;
}
@keyframes shake{
    0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}
    40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}
}
.option-btn:disabled{cursor:default;opacity:.85;transform:translateY(0)}
.option-btn.hint-pulse{animation:hintPulse 1s infinite}
@keyframes hintPulse{
    0%{border-color:#e2c6a2}50%{border-color:#ffb74d;background:#fff6e6;transform:scale(1.02)}
    100%{border-color:#e2c6a2;transform:scale(1)}
}

.feedback-msg{
    text-align:center;font-size:1.1rem;font-weight:600;min-height:2.4rem;
    padding:4px;margin:2px 0;letter-spacing:1px;transition:all .2s;
}
.feedback-msg.success{color:#2e7d32}
.feedback-msg.error{color:#b33e3e}

.action-area{display:flex;justify-content:center;gap:10px;margin-top:6px;flex-wrap:wrap}
.btn{
    border:none;border-radius:60px;padding:13px 26px;font-size:1.15rem;font-weight:700;
    color:#4a2e18;letter-spacing:3px;cursor:pointer;transition:all .1s ease;
    display:inline-flex;align-items:center;gap:6px;font-family:inherit;
}
.btn-next{background:#ffb74d;box-shadow:0 8px 0 #b46f1e,0 10px 18px rgba(150,90,30,.3)}
.btn-next:active:not(:disabled){transform:translateY(5px);box-shadow:0 3px 0 #b46f1e,0 8px 14px rgba(150,90,30,.25)}
.btn-next:disabled{opacity:.45;transform:translateY(5px);box-shadow:0 3px 0 #b46f1e;cursor:default}
.btn-hint{
    background:#a5d6a7;box-shadow:0 8px 0 #558b2f,0 10px 18px rgba(70,120,50,.25);
    font-size:1rem;padding:13px 18px;
}
.btn-hint:active:not(:disabled){transform:translateY(5px);box-shadow:0 3px 0 #558b2f,0 8px 14px rgba(70,120,50,.2)}
.btn-hint:disabled{opacity:.4;transform:translateY(5px);box-shadow:0 3px 0 #558b2f;cursor:default}
.btn-speak{
    background:#90caf9;box-shadow:0 8px 0 #1565c0,0 10px 18px rgba(30,100,180,.25);
    font-size:1rem;padding:13px 18px;
}
.btn-speak:active:not(:disabled){transform:translateY(5px);box-shadow:0 3px 0 #1565c0,0 8px 14px rgba(30,100,180,.2)}
.btn-speak:disabled{opacity:.4;transform:translateY(5px);box-shadow:0 3px 0 #1565c0;cursor:default}
.btn-primary{
    background:#ffb74d;box-shadow:0 8px 0 #b46f1e,0 10px 18px rgba(150,90,30,.3);
    font-size:1.25rem;padding:15px 38px;letter-spacing:4px;
}
.btn-primary:active{transform:translateY(5px);box-shadow:0 3px 0 #b46f1e,0 8px 14px rgba(150,90,30,.25)}
.btn-order{
    background:#ce93d8;box-shadow:0 8px 0 #7b1fa2,0 10px 18px rgba(120,30,160,.25);
    font-size:1rem;padding:13px 18px;color:#3a0a4a;
}
.btn-order:active:not(:disabled){transform:translateY(5px);box-shadow:0 3px 0 #7b1fa2,0 8px 14px rgba(120,30,160,.2)}
.btn-order:disabled{opacity:.4;transform:translateY(5px);box-shadow:0 3px 0 #7b1fa2;cursor:default}

.order-area{margin-top:8px}
.order-title{
    text-align:center;font-size:1.05rem;color:#a1582e;font-weight:700;
    letter-spacing:1px;margin-bottom:10px;
}
.order-slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.order-slot{
    background:#f7e9d5;border:3px dashed #d9b382;border-radius:18px;
    padding:14px 6px;text-align:center;font-size:1.15rem;font-weight:700;
    color:#6b3f1c;letter-spacing:3px;min-height:52px;
    display:flex;align-items:center;justify-content:center;transition:all .2s;
}
.order-slot.filled{background:#e8f5e9;border:3px solid #6b9e6b;color:#1e4a1e}
.order-slot.correct{background:#c8e6c9;border:3px solid #4a754a;color:#1e4a1e}
.order-slot.wrong{
    background:#ffcdd2;border:3px solid #c97b7b;color:#6b2a2a;animation:shake .4s ease;
}
.order-pool{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.order-card{
    background:#fffcf6;border:3px solid #e2c6a2;border-radius:18px;
    padding:12px 6px;font-size:1.15rem;font-weight:700;color:#3d2b1a;
    cursor:pointer;transition:all .1s ease;letter-spacing:3px;
    box-shadow:0 5px 0 #b28b5c;text-align:center;word-break:break-all;
}
.order-card:active{transform:translateY(3px);box-shadow:0 2px 0 #b28b5c}
.order-card.used{opacity:.3;pointer-events:none;box-shadow:none;transform:translateY(3px)}

.result-screen{text-align:center;padding:16px 8px;animation:fadeIn .4s ease}
.result-emoji{font-size:3.5rem;line-height:1;margin-bottom:6px}
.result-title{font-size:1.4rem;font-weight:800;color:#a1582e;letter-spacing:3px;margin-bottom:4px}
.result-sub{font-size:.9rem;color:#b98a63;margin-bottom:12px;letter-spacing:1px}
.result-stars{font-size:2.2rem;letter-spacing:8px;margin-bottom:14px;min-height:2.6rem}
.result-stats{
    display:inline-flex;gap:20px;background:#f7e9d5;border-radius:30px;
    padding:12px 24px;margin-bottom:18px;box-shadow:inset 0 2px 6px rgba(150,100,50,.15);
}
.result-stat{text-align:center}
.result-stat .num{font-size:1.4rem;font-weight:800;color:#6b3f1c}
.result-stat .lbl{font-size:.7rem;color:#a5835a;font-weight:600;letter-spacing:1px}

.fulltext-view{
    background:#fef9ef;border-radius:24px;padding:18px 16px;margin-top:10px;
    box-shadow:inset 0 0 0 2px #f7e2c0;max-height:420px;overflow-y:auto;
}
.fulltext-view .ft-line{
    font-size:.95rem;color:#6b3f1c;line-height:1.9;letter-spacing:1px;
    text-align:center;padding:3px 0;
}
.fulltext-view .ft-line .ft-pinyin{
    display:block;font-size:.68rem;color:#b98a63;font-weight:600;letter-spacing:1px;
}
.fulltext-view .ft-line.learned{color:#2e7d32;font-weight:700}
.fulltext-view .ft-line.learned .ft-pinyin{color:#4a754a}
.fulltext-view .ft-line.partial{color:#f57c00;font-weight:700}

.footer-note{
    margin-top:14px;text-align:center;color:#c2a07e;font-size:.75rem;
    letter-spacing:1px;font-weight:500;
}

.confetti{
    position:fixed;pointer-events:none;font-size:1.7rem;z-index:9999;
    animation:confettiFall 1.2s ease-out forwards;
}
@keyframes confettiFall{
    0%{transform:translateY(0) rotate(0);opacity:1}
    100%{transform:translateY(100vh) rotate(720deg);opacity:0}
}
.float-star{
    position:fixed;pointer-events:none;font-size:1.5rem;z-index:9999;
    animation:floatUp .9s ease-out forwards;
}
@keyframes floatUp{
    0%{transform:translateY(0) scale(1);opacity:1}
    100%{transform:translateY(-120px) scale(1.6);opacity:0}
}

@media (max-width:540px){
    .game-wrapper{padding:14px;border-radius:28px}
    .header h1{font-size:1.05rem;letter-spacing:1px}
    .score-board{padding:5px 10px;font-size:.8rem}
    .score-board .star{font-size:1rem}
    .back-btn{font-size:.8rem;padding:6px 12px}
    .big-line{font-size:2.8rem;letter-spacing:8px}
    .big-pinyin{font-size:.9rem}
    .learn-card{height:220px}
    .card-back .question-mark{font-size:4.5rem}
    .option-btn{font-size:1.4rem;padding:14px 6px;border-radius:16px;letter-spacing:4px}
    .btn{font-size:.9rem;padding:10px 16px;letter-spacing:1px}
    .btn-hint,.btn-speak,.btn-order{font-size:.85rem;padding:10px 14px}
    .btn-primary{font-size:1.05rem;padding:12px 26px}
    .feedback-msg{font-size:.95rem}
    .level-grid{grid-template-columns:repeat(3,1fr);gap:7px}
    .level-card{padding:10px 4px 8px}
    .level-card .lv-num{font-size:1.05rem}
    .order-card,.order-slot{font-size:1rem;padding:10px 4px;letter-spacing:2px}
    .review-banner{padding:12px 14px}
    .review-banner .rb-icon{font-size:1.6rem}
    .review-banner .rb-title{font-size:.9rem}
    .review-banner .rb-count{font-size:.95rem;padding:5px 12px}
}
</style>
</head>
<body>
<div class="game-wrapper">
    <div class="header">
        <button class="back-btn" id="backBtn" type="button" hidden>← 返回</button>
        <h1><span>📖</span> 三字经 · 闯关</h1>
        <div class="header-right">
            <div class="score-board" id="scoreBoard">
                <span class="star">⭐</span>
                <span id="scoreDisplay">0</span>
            </div>
        </div>
    </div>

    <div class="level-bar" id="levelBar" style="display:none">
        <div class="level-info">
            <span class="level-badge" id="levelBadge">第1关</span>
            <span class="level-title" id="levelTitle"></span>
        </div>
        <div class="level-dots" id="levelDots"></div>
    </div>

    <div id="mainArea"></div>

    <div class="footer-note">《三字经》· 人之初 性本善</div>
</div>

<script>
(function(){
'use strict';

/* ============================================================
   三字经全文
   ============================================================ */
const SANZIJING_LINES = [
    { pinyin: 'rén zhī chū xìng běn shàn xìng xiāng jìn xí xiāng yuǎn', hanzi: '人之初 性本善 性相近 习相远' },
    { pinyin: 'gǒu bú jiào xìng nǎi qiān jiào zhī dào guì yǐ zhuān', hanzi: '苟不教 性乃迁 教之道 贵以专' },
    { pinyin: 'xī mèng mǔ zé lín chǔ zǐ bù xué duàn jī zhù', hanzi: '昔孟母 择邻处 子不学 断机杼' },

function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    return arr;
}
function pickRandom(arr,n){
    const copy=[...arr]; shuffle(copy); return copy.slice(0,n);
}

let speechSynth = window.speechSynthesis;
let chineseVoice = null;
function loadVoices(){
    if(!speechSynth) return;
    const v = speechSynth.getVoices();
    chineseVoice = v.find(x => x.lang && (x.lang.includes('zh')||x.lang.includes('CN'))) || v[0] || null;
}
if(speechSynth){ loadVoices(); speechSynth.onvoiceschanged = loadVoices; }
function speak(text, rate=0.85){
    if(!speechSynth || !text) return;
    speechSynth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang='zh-CN'; u.rate=rate; u.pitch=1.05;
    if(chineseVoice) u.voice=chineseVoice;
    speechSynth.speak(u);
}

let audioCtx=null;
function getAudioCtx(){
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    return audioCtx;
}
function playTone(freq,dur,type='sine',vol=0.12,delay=0){
    try{
        const ctx=getAudioCtx();
        const osc=ctx.createOscillator(); const g=ctx.createGain();
        osc.type=type; osc.frequency.value=freq; g.gain.value=vol;
        osc.connect(g); g.connect(ctx.destination);
        const t=ctx.currentTime+delay;
        osc.start(t);
        g.gain.setValueAtTime(vol,t);
        g.gain.exponentialRampToValueAtTime(0.001,t+dur);
        osc.stop(t+dur);
    }catch(e){}
}

function updateMemory(unitIdx, correct){
    if(!state.memoryData[unitIdx]){
        state.memoryData[unitIdx] = { stage: 0, nextReview: 0, wrongCount: 0, lastReview: Date.now() };
    }
    const m = state.memoryData[unitIdx];
    m.lastReview = Date.now();
    if(correct){
        if(m.stage < EBBINGHAUS_INTERVALS.length-1) m.stage++;
        m.nextReview = Date.now() + EBBINGHAUS_INTERVALS[m.stage];
        m.wrongCount = 0;
    } else {
        m.wrongCount++;
        m.stage = Math.max(0, m.stage - 1);
        m.nextReview = Date.now() + 2*60*1000;
    }
}
function getDueReviewUnits(){
    const now = Date.now();
    const due = [];
    for(const idxStr in state.memoryData){
        const idx = parseInt(idxStr);
        const m = state.memoryData[idx];
        if(m.nextReview <= now && state.learnedUnits.includes(idx)) due.push(idx);
    }
    due.sort((a,b)=>state.memoryData[a].nextReview - state.memoryData[b].nextReview);
    return due;
}

    state.inLevel = true;
    state.isReviewMode = true;
    state.levelIndex = -1;
    state.qIndex = 0;
    state.levelCorrect = 0;
    state.combo = 0;
    state.maxCombo = 0;

        sndClick();
    });
    nextBtn.addEventListener('click', ()=>{
        if(nextBtn.disabled) return;
        sndClick();
        state.qIndex++;
        nextQuestion();
    });
}

function buildOptions(correctIdx){
    const distractors = [];
    const used = new Set([correctIdx]);
    const currentUnit = UNITS[correctIdx];
    const sameLineUnits = [];
    for(let i=0; i<TOTAL_UNITS; i++){
        if(UNITS[i].lineIdx === currentUnit.lineIdx && i !== correctIdx) sameLineUnits.push(i);
    }
    shuffle(sameLineUnits);
    for(const n of sameLineUnits){
        if(distractors.length >= 3) break;
        if(!used.has(n)){ distractors.push(n); used.add(n); }
    }
    const neighbors = [];
    for(let d=1; d<=6; d++){
        if(correctIdx-d >= 0) neighbors.push(correctIdx-d);
        if(correctIdx+d < TOTAL_UNITS) neighbors.push(correctIdx+d);
    }
    shuffle(neighbors);
    for(const n of neighbors){
        if(distractors.length >= 3) break;
        if(!used.has(n)){ distractors.push(n); used.add(n); }
    }
    let attempts = 0;
    while(distractors.length < 3 && attempts < 500){
        const n = Math.floor(Math.random()*TOTAL_UNITS);
        if(!used.has(n)){ distractors.push(n); used.add(n); }
        attempts++;
    }
    const all = [correctIdx, ...distractors];
    shuffle(all);
    return all.map(i => ({ idx:i, hanzi3:UNITS[i].hanzi3 }));
}

function onOptionClick(e){
    if(state.locked) return;
    const btn = e.currentTarget;
    const isCorrect = btn.dataset.correct === 'true';
    const unitIdx = state.currentQ.idx;
    const unit = UNITS[unitIdx];

    if(!state.flipped){
        if(state.flipTimer){ clearTimeout(state.flipTimer); state.flipTimer=null; }
        state.flipped = true;
        const lc = $('learnCard');
        if(lc) lc.classList.add('flipped');
        const ch = $('countdownHint');
        if(ch) ch.classList.remove('show');
        sndFlip();
    }

    const allBtns = document.querySelectorAll('.option-btn');

    if(isCorrect){
        state.locked = true;
        const nextBtn=$('nextBtn'), hintBtn=$('hintBtn'), speakBtn=$('speakBtn');
        if(nextBtn) nextBtn.disabled = false;
        if(hintBtn) hintBtn.disabled = true;
        if(speakBtn) speakBtn.disabled = true;
        allBtns.forEach(b=>{ b.disabled=true; b.classList.remove('hint-pulse'); });

        btn.classList.add('correct');
        state.totalScore++;
        state.levelCorrect++;
        state.combo++;
        if(state.combo > state.maxCombo) state.maxCombo = state.combo;
        updateTopScore();

        if(!state.learnedUnits.includes(unitIdx)) state.learnedUnits.push(unitIdx);
        updateMemory(unitIdx, true);
        saveGame();

        spawnFloatStars(btn, 5);
        if(scoreBoard){ scoreBoard.classList.add('bump'); setTimeout(()=>scoreBoard.classList.remove('bump'), 400); }
        spawnConfetti(state.combo>=3?16:8);
        sndCorrect();
        setTimeout(sndStar, 200);
        setTimeout(()=>speak(unit.hanzi3, 0.8), 250);

        const fb = $('feedbackMsg');
        if(fb){
            fb.textContent = state.combo>=3 ? `🎉 连对 ${state.combo} 句！` : '🎉 答对了！';
            fb.className = 'feedback-msg success';
        }
        if(state.isReviewMode){
            if(nextBtn) nextBtn.textContent = '继续 ➡️';
        } else if(state.qIndex >= state.levelQuestions.length-1){
            if(nextBtn) nextBtn.textContent = '📝 背诵检验';
        }
    } else {
        btn.classList.add('wrong');
        allBtns.forEach(b=>{
            if(b.dataset.correct === 'true') b.classList.add('correct');
        });
        const lc = $('learnCard');
        if(lc && state.flipped){
            state.flipped = false;
            lc.classList.remove('flipped');
            sndFlip();
        }
        state.combo = 0;
        sndWrong();
        setTimeout(()=>speak(unit.hanzi3, 0.8), 350);
        updateMemory(unitIdx, false);
        saveGame();

        const fb = $('feedbackMsg');
        if(fb){
            fb.textContent = '💪 再看看正确的字，然后重选一次～';
            fb.className = 'feedback-msg error';
        }
        setTimeout(()=>{
            allBtns.forEach(b=>{
                b.classList.remove('wrong');
                b.disabled = false;
            });
            state.locked = false;
            const fb2 = $('feedbackMsg');
            if(fb2){
                fb2.textContent = '🤔 再选一次，哪三个字是刚才看到的？';
                fb2.className = 'feedback-msg';
            }
        }, 2000);
    }
}

/* 排序模式 */
function startOrderMode(){
    state.orderMode = true;
    const newUnits = state.levelQuestions.filter(q=>!q.isReview).map(q=>q.idx);
    if(newUnits.length < 2){ finishLevel(); return; }
    state.orderSlots = new Array(newUnits.length).fill(null);
    state.orderPool = shuffle([...newUnits]);
    state.orderSlotIndex = 0;
    renderOrderMode();
}

function renderOrderMode(){
    levelBar.style.display = 'none';
    const newUnits = state.levelQuestions.filter(q=>!q.isReview).map(q=>q.idx);

    let html = `
    <div class="fade-in">
        <div class="order-area">
            <div class="order-title">📝 背诵检验：按顺序排出本关学的句子</div>
            <div class="order-slots" id="orderSlots">`;
    newUnits.forEach((idx, i)=>{
        const filled = state.orderSlots[i];
        const slotText = filled !== null ? UNITS[filled].hanzi3 : `第${i+1}句`;
        const cls = filled !== null ? 'order-slot filled' : 'order-slot';
        html += `<div class="${cls}" data-slot="${i}">${slotText}</div>`;
    });
    html += `</div>
            <div style="text-align:center;font-size:.85rem;color:#a5835a;font-weight:600;margin-bottom:8px">
                点击下方字，按顺序填入
            </div>
            <div class="order-pool" id="orderPool">`;
    state.orderPool.forEach(idx=>{
        const used = state.orderSlots.includes(idx);
        html += `<div class="order-card ${used?'used':''}" data-idx="${idx}">${UNITS[idx].hanzi3}</div>`;
    });
    html += `</div>
            <div class="feedback-msg" id="orderFeedback"></div>
            <div class="action-area">
                <button class="btn btn-order" id="checkOrderBtn" type="button" disabled>✅ 检查</button>
                <button class="btn btn-speak" id="orderSpeakBtn" type="button">🔊 听一听</button>
            </div>
        </div>
    </div>`;
    mainArea.innerHTML = html;

    mainArea.querySelectorAll('.order-card').forEach(card=>{
        card.addEventListener('click', ()=>{
            if(state.orderSlotIndex >= state.orderSlots.length) return;
            const idx = parseInt(card.dataset.idx);
            if(state.orderSlots.includes(idx)) return;
            sndClick();
            state.orderSlots[state.orderSlotIndex] = idx;
            state.orderSlotIndex++;
            renderOrderMode();
        });
    });
    mainArea.querySelectorAll('.order-slot').forEach(slot=>{
        slot.addEventListener('click', ()=>{
            const i = parseInt(slot.dataset.slot);
            if(state.orderSlots[i] !== null){
                sndClick();
                for(let j=i; j<state.orderSlots.length; j++) state.orderSlots[j] = null;
                state.orderSlotIndex = i;
                renderOrderMode();
            }
        });
    });
    $('orderSpeakBtn').addEventListener('click', ()=>{
        sndClick();
        const text = newUnits.map(i=>UNITS[i].hanzi3).join('，');
        speak(text, 0.8);
    });
    const checkBtn = $('checkOrderBtn');
    if(state.orderSlotIndex >= state.orderSlots.length) checkBtn.disabled = false;
    checkBtn.addEventListener('click', ()=>{
        if(checkBtn.disabled) return;
        checkOrder(checkBtn);
    });
}

function checkOrder(checkBtn){
    checkBtn.disabled = true;
    const newUnits = state.levelQuestions.filter(q=>!q.isReview).map(q=>q.idx);
    let allCorrect = true;
    const slots = document.querySelectorAll('.order-slot');
    newUnits.forEach((correctIdx, i)=>{
        const userIdx = state.orderSlots[i];
        if(userIdx === correctIdx) slots[i].classList.add('correct');
        else { slots[i].classList.add('wrong'); allCorrect = false; }
    });
    const fb = $('orderFeedback');
    if(allCorrect){
        sndCorrect(); spawnConfetti(20);
        fb.textContent = '🎉 太棒了！顺序完全正确！';
        fb.className = 'feedback-msg success';
        setTimeout(()=>finishLevel(), 1500);
    } else {
        sndWrong();
        fb.textContent = '💪 顺序有点不对，看看正确的顺序～';
        fb.className = 'feedback-msg error';
        setTimeout(()=>{
            const slots2 = document.querySelectorAll('.order-slot');
            slots2.forEach((slot, i)=>{
                slot.textContent = UNITS[newUnits[i]].hanzi3;
                slot.classList.remove('wrong');
                slot.classList.add('correct');
            });
            setTimeout(()=>finishLevel(), 2200);
        }, 1500);
    }
}

/* 复习结算 */
function finishReviewMode(){
    state.inLevel = false;
    levelBar.style.display = 'none';
    backBtn.hidden = false;
    const total = state.levelQuestions.length;
    const correct = state.levelCorrect;
    sndLevelUp(); spawnConfetti(20);
    mainArea.innerHTML = `
    <div class="result-screen fade-in">
        <div class="result-emoji">🧠</div>
        <div class="result-title">复习完成！</div>
        <div class="result-sub">艾宾浩斯记忆，让知识更牢固</div>
        <div class="result-stats">
            <div class="result-stat"><div class="num">${correct}/${total}</div><div class="lbl">答对</div></div>
            <div class="result-stat"><div class="num">${state.learnedUnits.length}</div><div class="lbl">累计学会</div></div>
        </div>
        <div class="action-area">
            <button class="btn btn-primary" id="backMapBtn" type="button">🔙 返回地图</button>
        </div>
    </div>`;
    $('backMapBtn').addEventListener('click', ()=>{ sndClick(); goToMap(); });
    saveGame();
}

/* 新关卡结算 */
function finishLevel(){
    state.inLevel = false;
    levelBar.style.display = 'none';
    state.orderMode = false;
    backBtn.hidden = false;

    const total = state.levelQuestions.length;
    const correct = state.levelCorrect;
    const pct = correct / total;

    let stars = 0;
    if(pct >= 0.9) stars = 3;
    else if(pct >= 0.7) stars = 2;
    else if(pct >= 0.5) stars = 1;
    if(correct === total && state.maxCombo === total) stars = 3;

    const prevStars = state.levelStars[state.levelIndex] || 0;
    if(stars > prevStars) state.levelStars[state.levelIndex] = stars;
    if(state.levelIndex === state.currentLevel && state.currentLevel < TOTAL_LEVELS) state.currentLevel++;
    saveGame();

    let emoji, title, sub;
    if(stars === 3){ emoji='🏆'; title='完美通关！'; sub='全部答对，太厉害了！'; }
    else if(stars === 2){ emoji='🌟'; title='很棒！'; sub='再仔细一点就满星啦～'; }
    else if(stars === 1){ emoji='👍'; title='通过啦'; sub='继续加油，再挑战一次吧！'; }
    else { emoji='💪'; title='再来一次吧'; sub='别灰心，多练几次就记住啦～'; }

    if(stars > 0){ sndLevelUp(); spawnConfetti(30); } else { sndWrong(); }

    const isLast = state.levelIndex >= TOTAL_LEVELS - 1;
    const nextBtnText = isLast ? '🏆 回到地图' : '➡️ 下一关';

    mainArea.innerHTML = `
    <div class="result-screen fade-in">
        <div class="result-emoji">${emoji}</div>
        <div class="result-title">${title}</div>
        <div class="result-sub">${sub}</div>
        <div class="result-stars">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
        <div class="result-stats">
            <div class="result-stat"><div class="num">${correct}/${total}</div><div class="lbl">答对</div></div>
            <div class="result-stat"><div class="num">${state.maxCombo}</div><div class="lbl">最高连击</div></div>
            <div class="result-stat"><div class="num">${state.learnedUnits.length}</div><div class="lbl">累计学会</div></div>
        </div>
        <div style="margin-bottom:16px">
            <div style="font-size:.9rem;color:#8a6a4a;font-weight:600;margin-bottom:8px">本关学习的句子：</div>
            <div style="font-size:.95rem;color:#6b3f1c;line-height:1.9;background:#f7e9d5;border-radius:16px;padding:10px 14px;letter-spacing:3px">
                ${state.levelQuestions.filter(q=>!q.isReview).map(q=>UNITS[q.idx].hanzi3).join(' · ')}
            </div>
        </div>
        <div class="action-area">
            <button class="btn btn-hint" id="retryBtn" type="button">🔄 重玩本关</button>
            <button class="btn btn-primary" id="nextLevelBtn" type="button">${nextBtnText}</button>
        </div>
    </div>`;

    $('retryBtn').addEventListener('click', ()=>{ sndClick(); startLevel(state.levelIndex); });
    $('nextLevelBtn').addEventListener('click', ()=>{
        sndClick();
        if(isLast) goToMap();
        else startLevel(state.levelIndex + 1);
    });
    setTimeout(()=>{
        if(stars === 3) speak('完美通关，你太棒了', 0.9);
        else if(stars === 2) speak('很棒，再仔细一点就满星了', 0.9);
        else if(stars === 1) speak('通过啦，继续加油', 0.9);
        else speak('再来一次吧，多练几次就记住啦', 0.9);
    }, 500);
}

/* ============================================================
   初始化
   ============================================================ */
function init(){
    const save = loadSave();
    if(save){
        state.currentLevel = save.currentLevel || 0;
        state.levelStars = save.levelStars || new Array(TOTAL_LEVELS).fill(0);
        state.learnedUnits = save.learnedUnits || [];
        state.totalScore = save.totalScore || 0;
        state.memoryData = save.memoryData || {};
        while(state.levelStars.length < TOTAL_LEVELS) state.levelStars.push(0);
        const learned = state.learnedUnits.length;
        if(learned > 0){
            setTimeout(()=>{
                const due = getDueReviewUnits();
                if(due.length > 0) speak(`欢迎回来，有${due.length}句需要复习`, 0.9);
                else speak(`欢迎回来，已学会${learned}句`, 0.9);
            }, 600);
        }
    } else {
        state.levelStars = new Array(TOTAL_LEVELS).fill(0);
    }

    updateTopScore();
    document.body.addEventListener('click', ()=>{ getAudioCtx(); }, { once:true });

    /* ✅ 全局事件委托绑定返回按钮，保证一定能响应 */
    document.addEventListener('click', (e)=>{
        if(e.target && e.target.id === 'backBtn'){
            e.preventDefault();
            e.stopPropagation();
            sndClick();
            if(state.inLevel || state.orderMode){
                const ok = confirm('已保存进度！确定要返回主界面吗？');
                if(ok) goToMap();
            } else {
                goToMap();
            }
        }
    });

    renderMap();
}

window.addEventListener('DOMContentLoaded', init);
})();
</script>
