<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐼 熊猫识字岛 · 一年级</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box;
      font-family:'Comic Sans MS','幼圆','Yuanti SC',sans-serif; }
  body {
    min-height:100vh;
    background:linear-gradient(160deg,#a8d8ea 0%,#d4e9f7 40%,#ffe8d0 100%);
    display:flex; justify-content:center; align-items:center; padding:12px;
  }
  .game {
    width:100%; max-width:760px; background:#fffdf7;
    border-radius:44px; padding:18px 18px 24px;
    border:4px solid #7fb8d9;
    box-shadow:0 18px 30px rgba(60,120,160,.2);
    position:relative; overflow:hidden;
  }

  /* 顶部栏 */
  .topbar {
    display:flex; justify-content:space-between; align-items:center;
    background:#e3f0fa; padding:8px 14px; border-radius:32px;
    margin-bottom:12px; border:2px solid #9cc7e3; color:#2c6a8f;
    font-weight:bold; font-size:.9rem; flex-wrap:wrap; gap:5px;
  }
  .topbar > div { background:#ffffffcc; padding:4px 11px; border-radius:22px; }

  /* 关卡地图 */
  .map-screen { text-align:center; }
  .map-title { font-size:1.5rem; color:#2c6a8f; margin-bottom:8px; }
  .map-sub { font-size:.95rem; color:#5a8aa8; margin-bottom:16px; }
  .islands {
    display:grid; grid-template-columns:repeat(2,1fr); gap:14px;
    margin-bottom:14px;
  }
  .island {
    background:linear-gradient(145deg,#e8f4fd,#d0e7f7);
    border:3px solid #9cc7e3; border-radius:32px; padding:16px 10px;
    cursor:pointer; transition:.15s; position:relative;
    box-shadow:0 6px 0 #9cc7e3;
  }
  .island:hover:not(.locked) { transform:translateY(-3px); box-shadow:0 9px 0 #9cc7e3; }
  .island:active:not(.locked) { transform:translateY(3px); box-shadow:0 3px 0 #9cc7e3; }
  .island.locked { opacity:.55; cursor:not-allowed; filter:grayscale(.5); }
  .island-emoji { font-size:2.6rem; }
  .island-name { font-size:1.1rem; font-weight:bold; color:#2c6a8f; margin-top:4px; }
  .island-info { font-size:.8rem; color:#5a8aa8; margin-top:2px; }
  .island-stars { font-size:1rem; margin-top:4px; letter-spacing:2px; }

  /* 游戏屏幕 */
  .game-screen { display:none; }
  .game-screen.active { display:block; }
  .map-screen.hidden { display:none; }

  .back-btn {
    background:#e3f0fa; border:2px solid #9cc7e3; border-radius:20px;
    padding:5px 14px; font-size:.85rem; font-weight:bold; color:#2c6a8f;
    cursor:pointer; margin-bottom:10px;
  }
  .back-btn:hover { background:#d0e7f7; }

  /* 进度条 */
  .progress-wrap {
    background:#e3f0fa; border-radius:20px; height:22px;
    margin-bottom:12px; overflow:hidden; border:2px solid #9cc7e3;
    position:relative;
  }
  .progress-bar {
    height:100%; background:linear-gradient(90deg,#7fb8d9,#5a9bc0);
    width:0%; transition:.4s; border-radius:18px;
  }
  .progress-text {
    position:absolute; top:0; left:0; width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    font-size:.8rem; font-weight:bold; color:#1e4a66;
  }

  /* 熊猫伙伴 */
  .panda-area {
    display:flex; align-items:center; gap:12px; margin-bottom:12px;
    background:#fff3e6; border-radius:32px; padding:10px 14px;
    border:2px dashed #ffcfae;
  }
  .panda-face {
    font-size:3rem; transition:.2s; flex-shrink:0;
  }
  .panda-face.happy { animation:jump .5s ease; }
  .panda-face.sad { animation:shake .4s ease; }
  @keyframes jump {
    0%,100%{transform:translateY(0) scale(1);}
    30%{transform:translateY(-14px) scale(1.15);}
    60%{transform:translateY(-4px) scale(1.05);}
  }
  @keyframes shake {
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-6px) rotate(-5deg);}
    75%{transform:translateX(6px) rotate(5deg);}
  }
  .panda-says {
    background:#fff; border-radius:22px; padding:8px 14px;
    font-size:.98rem; color:#784b2e; font-weight:600;
    position:relative; flex:1; min-height:2.6rem;
    display:flex; align-items:center;
  }
  .panda-says::before {
    content:''; position:absolute; left:-8px; top:50%;
    transform:translateY(-50%);
    border:8px solid transparent; border-right-color:#fff;
  }

  /* 看字区 */
  .char-area {
    background:#fff; border-radius:36px; padding:14px;
    margin-bottom:12px; text-align:center;
    border:3px solid #ffcfae;
    box-shadow:inset 0 -3px 0 #fff3e6;
  }
  .big-char {
    font-size:6rem; line-height:1.1; color:#5e3a2b;
    font-family:'楷体','KaiTi','STKaiti',serif; font-weight:700;
    text-shadow:5px 5px 0 #f5d5bd; letter-spacing:6px;
  }
  .char-actions {
    display:flex; justify-content:center; align-items:center;
    gap:10px; margin-top:8px; flex-wrap:wrap;
  }
  .speaker {
    background:#ffd36e; border:none; border-radius:50%;
    width:54px; height:54px; font-size:1.6rem; cursor:pointer;
    box-shadow:0 5px 0 #c9932b; transition:.05s;
  }
  .speaker:active { transform:translateY(5px); box-shadow:0 0 0 #c9932b; }
  .iknow-btn {
    background:#c8e6c9; border:2px solid #66bb6a; border-radius:26px;
    padding:9px 20px; font-size:.95rem; font-weight:bold; color:#2e7d32;
    cursor:pointer; box-shadow:0 4px 0 #4e9a4e; transition:.05s;
  }
  .iknow-btn:hover:not(:disabled) { background:#d7efd8; transform:translateY(-2px); box-shadow:0 6px 0 #4e9a4e; }
  .iknow-btn:active:not(:disabled) { transform:translateY(3px); box-shadow:0 1px 0 #4e9a4e; }
  .iknow-btn:disabled { opacity:.5; cursor:default; }

  /* 词语选项 */
  .word-options { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:12px; }
  .word-btn {
    background:#fff; border:3px solid #7fb8d9; border-radius:32px;
    padding:14px 6px; font-size:1.4rem; font-weight:700; color:#1e4a66;
    cursor:pointer; box-shadow:0 6px 0 #5a9bc0; transition:.05s;
    font-family:'楷体','KaiTi','STKaiti',serif;
  }
  .word-btn:hover:not(:disabled) { background:#eaf5fc; transform:translateY(-2px); box-shadow:0 8px 0 #5a9bc0; }
  .word-btn:active:not(:disabled) { transform:translateY(4px); box-shadow:0 2px 0 #5a9bc0; }
  .word-btn.correct { background:#b1e6b1; border-color:#4e9a4e; box-shadow:0 4px 0 #347834; color:#1d4d1d; }
  .word-btn.wrong { background:#f8b5b5; border-color:#b64545; box-shadow:0 4px 0 #8a3535; color:#5e1f1f; }
  .word-btn:disabled { cursor:default; opacity:.93; }

  /* 连击提示 */
  .combo-pop {
    position:fixed; top:30%; left:50%; transform:translate(-50%,-50%);
    font-size:3rem; font-weight:bold; color:#ff6b35;
    text-shadow:3px 3px 0 #fff, 5px 5px 0 #ffb347;
    pointer-events:none; opacity:0; z-index:99;
  }
  .combo-pop.show { animation:comboAnim .9s ease; }
  @keyframes comboAnim {
    0%{opacity:0; transform:translate(-50%,-50%) scale(.4);}
    30%{opacity:1; transform:translate(-50%,-50%) scale(1.2);}
    70%{opacity:1; transform:translate(-50%,-80%) scale(1);}
    100%{opacity:0; transform:translate(-50%,-120%) scale(.9);}
  }

  /* 反馈 */
  .feedback {
    text-align:center; font-size:1.1rem; font-weight:600; min-height:3rem;
    background:#fff3e6; padding:9px; border-radius:30px; color:#7b4a2e;
    margin-bottom:10px; line-height:1.5;
  }
  .next {
    width:100%; background:#ffb347; border:none; border-radius:40px;
    padding:13px; font-size:1.4rem; font-weight:bold; color:#422b1b;
    cursor:pointer; box-shadow:0 7px 0 #b16f2c; letter-spacing:3px;
    border:2px solid #ffe5b4; transition:.05s;
  }
  .next:hover:not(:disabled) { background:#ffbb5c; transform:translateY(-2px); box-shadow:0 9px 0 #b16f2c; }
  .next:active:not(:disabled) { transform:translateY(5px); box-shadow:0 2px 0 #b16f2c; }
  .next:disabled { opacity:.5; cursor:not-allowed; }

  /* 通关弹窗 */
  .modal-mask {
    position:fixed; inset:0; background:rgba(0,0,0,.45);
    display:none; justify-content:center; align-items:center; z-index:100;
    padding:20px;
  }
  .modal-mask.show { display:flex; }
  .modal {
    background:#fffdf7; border-radius:40px; padding:26px 22px;
    max-width:420px; width:100%; text-align:center;
    border:4px solid #ffb88c; animation:popIn .3s ease;
  }
  @keyframes popIn { from{transform:scale(.7);opacity:0;} to{transform:scale(1);opacity:1;} }
  .modal-emoji { font-size:4rem; }
  .modal-title { font-size:1.6rem; color:#b45f3a; margin:8px 0; }
  .modal-text { font-size:1rem; color:#784b2e; margin-bottom:16px; line-height:1.6; }
  .modal-btn {
    background:#ffb347; border:none; border-radius:30px;
    padding:12px 30px; font-size:1.2rem; font-weight:bold; color:#422b1b;
    cursor:pointer; box-shadow:0 6px 0 #b16f2c; margin:4px;
  }
  .modal-btn:active { transform:translateY(5px); box-shadow:0 1px 0 #b16f2c; }

  @media(max-width:520px){
    .big-char{font-size:4.5rem;}
    .word-btn{font-size:1.15rem;padding:12px 4px;}
    .island-emoji{font-size:2rem;}
    .island-name{font-size:.95rem;}
    .panda-face{font-size:2.4rem;}
    .panda-says{font-size:.85rem;}
  }
</style>
</head>
<body>
<div class="game">

  <!-- 顶部栏 -->
  <div class="topbar">
    <div>⭐ 得分: <span id="score">0</span></div>
    <div>🪙 金币: <span id="coins">0</span></div>
    <div>🔥 连击: <span id="combo">0</span></div>
  </div>

  <!-- ========== 关卡地图 ========== -->
  <div class="map-screen" id="mapScreen">
    <div class="map-title">🐼 熊猫识字岛</div>
    <div class="map-sub">选一个岛，开始认字冒险吧！</div>
    <div class="islands" id="islands"></div>
  </div>

  <!-- ========== 游戏屏幕 ========== -->
  <div class="game-screen" id="gameScreen">
    <button class="back-btn" id="backBtn">⬅ 返回地图</button>

    <div class="progress-wrap">
      <div class="progress-bar" id="progressBar"></div>
      <div class="progress-text" id="progressText">0 / 50</div>
    </div>

    <!-- 熊猫伙伴 -->
    <div class="panda-area">
      <div class="panda-face" id="pandaFace">🐼</div>
      <div class="panda-says" id="pandaSays">先自己读一读这个字吧！</div>
    </div>

    <!-- 看字区 -->
    <div class="char-area">
      <div class="big-char" id="charDisplay">小</div>
      <div class="char-actions">
        <button class="speaker" id="speakBtn" title="点我听读音">🔊</button>
        <button class="iknow-btn" id="iKnowBtn">✅ 我读对了</button>
      </div>
    </div>

    <!-- 词语选项 -->
    <div class="word-options" id="wordOptions"></div>

    <div class="feedback" id="feedback">哪个词语里有这个字？</div>
    <button class="next" id="nextBtn" disabled>➡️ 下一个字</button>
  </div>
</div>

<!-- 连击弹出 -->
<div class="combo-pop" id="comboPop"></div>

<!-- 通关弹窗 -->
<div class="modal-mask" id="modalMask">
  <div class="modal">
    <div class="modal-emoji" id="modalEmoji">🎉</div>
    <div class="modal-title" id="modalTitle">通关啦！</div>
    <div class="modal-text" id="modalText"></div>
    <button class="modal-btn" id="modalBtn">继续冒险</button>
  </div>
</div>

  if(sv){

    coins=d.coins||0;
    unlockedIslands=d.unlocked||[0];
    islandStars=d.stars||{};
  }
}catch(e){}

function save(){
  try{
    localStorage.setItem('panda_game_v1', JSON.stringify({
      best:best, coins:coins, unlocked:unlockedIslands, stars:islandStars
    }));

}

/* 语音 */
function speak(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(text);
  u.lang='zh-CN'; u.rate=0.75; u.pitch=1.1;
  window.speechSynthesis.speak(u);
}

/* 音效（用 Web Audio 合成，不需要外部文件） */
function beep(type){
  try{
    var ctx=new (window.AudioContext||window.webkitAudioContext)();
    var o=ctx.createOscillator();
    var g=ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    if(type==='ok'){ o.frequency.value=880; o.type='sine'; g.gain.value=.1; o.start(); o.frequency.exponentialRampToValueAtTime(1320,ctx.currentTime+.15); o.stop(ctx.currentTime+.2); }
    else if(type==='no'){ o.frequency.value=300; o.type='sawtooth'; g.gain.value=.08; o.start(); o.frequency.exponentialRampToValueAtTime(150,ctx.currentTime+.2); o.stop(ctx.currentTime+.25); }
    else if(type==='coin'){ o.frequency.value=1200; o.type='square'; g.gain.value=.06; o.start(); o.frequency.exponentialRampToValueAtTime(1800,ctx.currentTime+.1); o.stop(ctx.currentTime+.15); }
  }catch(e){}
}

/* 渲染关卡地图 */
function renderMap(){
  islandsEl.innerHTML='';
  for(var i=0;i<islands.length;i++){
    (function(isl){
      var locked = unlockedIslands.indexOf(isl.id)===-1;
      var stars = islandStars[isl.id]||0;
      var div=document.createElement('div');
      div.className='island'+(locked?' locked':'');
      var starStr='';
      for(var s=0;s<3;s++) starStr += (s<stars?'⭐':'☆');
      div.innerHTML =
        '<div class="island-emoji">'+isl.emoji+'</div>'+
        '<div class="island-name">'+isl.name+'</div>'+
        '<div class="island-info">'+isl.desc+' · '+isl.data.length+'字</div>'+
        '<div class="island-stars">'+(locked?'🔒 未解锁':starStr)+'</div>';
      if(!locked){
        div.onclick=function(){ startIsland(isl); };
      }
      islandsEl.appendChild(div);
    })(islands[i]);
  }
}

/* 开始一个岛 */
function startIsland(isl){
  currentIsland=isl;
  // 打乱题目顺序
  islandQueue = isl.data.slice().sort(function(){return Math.random()-0.5;});
  islandIndex=0;
  wrongQueue=[];
  mapScreen.classList.add('hidden');
  gameScreen.classList.add('active');
  updateProgress();
  loadQuestion();
}

/* 更新进度条 */
function updateProgress(){
  var total=islandQueue.length;
  var done=islandIndex;
  var pct= total? (done/total*100):0;
  progressBar.style.width=pct+'%';
  progressText.textContent=done+' / '+total;
}

/* 出题 */
function loadQuestion(){
  answered=false;
  hasReadSelf=false;
  nextBtn.disabled=true;
  iKnowBtn.disabled=false;

  if(islandIndex>=islandQueue.length){
    finishIsland();
    return;
  }

  var q=islandQueue[islandIndex];
  currentQ=q;

  charDisplay.textContent=q.char;
  pandaSays.textContent='先自己读一读，不会读再点喇叭～';
  pandaFace.textContent='🐼';

  var words=[q.word].concat(q.wrong);
  words.sort(function(){return Math.random()-0.5;});

  wordOptionsEl.innerHTML='';
  for(var i=0;i<words.length;i++){
    (function(w){
      var b=document.createElement('button');
      b.className='word-btn'; b.type='button'; b.textContent=w;
      b.onclick=function(){ chooseWord(w,b); };
      wordOptionsEl.appendChild(b);
    })(words[i]);
  }

  feedbackEl.textContent='哪个词语里有这个字？';
  feedbackEl.style.color='#7b4a2e';
}

/* 我读对了 */
iKnowBtn.onclick=function(){
  if(hasReadSelf||answered) return;
  hasReadSelf=true;
  iKnowBtn.disabled=true;
  score+=2; scoreEl.textContent=score;
  pandaFace.textContent='😊';
  pandaSays.textContent='真棒！自己读出来了，+2分～';
  beep('coin');
};

/* 选词语 */
function chooseWord(word,btn){
  if(answered) return;
  answered=true;

  var all=wordOptionsEl.querySelectorAll('.word-btn');
  var ok=(word===currentQ.word);

  if(ok){
    combo++;
    if(combo>maxCombo) maxCombo=combo;
    var comboBonus = combo>=3 ? 5 : 0;
    score += 10 + comboBonus;
    coins += 1;
    scoreEl.textContent=score;
    coinsEl.textContent=coins;
    comboEl.textContent=combo;

    if(combo>=3){
      comboPop.textContent='🔥 连击 x'+combo+'！';
      comboPop.classList.remove('show');
      void comboPop.offsetWidth;
      comboPop.classList.add('show');
    }

    pandaFace.textContent='🥳';
    pandaSays.textContent='太棒啦！"'+currentQ.char+'" 读 '+currentQ.pinyin+'，在"'+word+'"里！'+(comboBonus?' 连击+'+comboBonus:'');

    feedbackEl.innerHTML='✅ 答对啦！<b>'+currentQ.char+'</b> 读 <b>'+currentQ.pinyin+'</b>，+10分'+(comboBonus?' 🔥连击+'+comboBonus:'');
    feedbackEl.style.color='#2e7d32';
    btn.classList.add('correct');
    pandaFace.classList.add('happy');
    setTimeout(function(){pandaFace.classList.remove('happy');},500);
    beep('ok');
    setTimeout(function(){speak(currentQ.char);},200);
  }else{
    combo=0;
    comboEl.textContent=0;
    pandaFace.textContent='😢';
    pandaSays.textContent='再想想… "'+currentQ.char+'" 读 "'+currentQ.pinyin+'" 哦';
    feedbackEl.innerHTML='❌ 再想想… <b>'+currentQ.char+'</b> 读 <b>'+currentQ.pinyin+'</b>，它在 <b>'+currentQ.word+'</b> 里';
    feedbackEl.style.color='#b64545';
    btn.classList.add('wrong');
    pandaFace.classList.add('sad');
    setTimeout(function(){pandaFace.classList.remove('sad');},400);
    beep('no');
    wrongQueue.push(currentQ);
    setTimeout(function(){speak(currentQ.char);},200);
  }

  for(var i=0;i<all.length;i++){
    all[i].disabled=true;
    if(all[i].textContent===currentQ.word) all[i].classList.add('correct');
  }
  iKnowBtn.disabled=true;
  nextBtn.disabled=false;
  updateProgress();
}

/* 下一题 */
nextBtn.onclick=function(){
  if(!answered) return;
  islandIndex++;
  updateProgress();
  loadQuestion();
};

speakBtn.onclick=function(){ if(currentQ) speak(currentQ.char); };

/* 完成一个岛 */
function finishIsland(){
  // 计算星星：答对率
  var total=islandQueue.length;
  var wrongCount=wrongQueue.length;
  var correctRate=(total-wrongCount)/total;
  var stars=correctRate>=0.9?3:(correctRate>=0.7?2:1);

  // 记录最高
  if(!islandStars[currentIsland.id] || stars>islandStars[currentIsland.id]){
    islandStars[currentIsland.id]=stars;
  }

  // 解锁下一个岛
  var nextId=currentIsland.id+1;
  if(nextId<islands.length && unlockedIslands.indexOf(nextId)===-1){
    unlockedIslands.push(nextId);
  }

  if(score>best){best=score;}
  save();

  // 弹窗
  var starStr='';
  for(var s=0;s<3;s++) starStr += (s<stars?'⭐':'☆');
  $('modalEmoji').textContent = stars===3?'🏆':(stars===2?'🎉':'💪');
  $('modalTitle').textContent = stars===3?'完美通关！':(stars===2?'通关啦！':'完成啦！');
  $('modalText').innerHTML =
    '本岛获得 '+starStr+'<br>'+
    '答对 '+(total-wrongCount)+' / '+total+' 个字<br>'+
    '金币 +'+coins+' 🪙<br><br>'+
    (nextId<islands.length?'🎁 已解锁新岛屿！':'🏝 所有岛屿都已解锁！');
  modalMask.classList.add('show');
}

/* 弹窗按钮 */
$('modalBtn').onclick=function(){
  modalMask.classList.remove('show');
  gameScreen.classList.remove('active');
  mapScreen.classList.remove('hidden');
  renderMap();
};

/* 返回地图 */
$('backBtn').onclick=function(){
  gameScreen.classList.remove('active');
  mapScreen.classList.remove('hidden');
  renderMap();
};

/* 启动 */
renderMap();
</script>
